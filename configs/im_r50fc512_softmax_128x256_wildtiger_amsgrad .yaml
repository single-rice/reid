model:
  name: 'resnet50_fc512'
  pretrained: True
  # Set this to a trained checkpoint for evaluation and visrank.
  

data:
  type: 'image'
  sources: ['wildtiger']
  targets: ['wildtiger']
  height: 128
  width: 256
  combineall: False
  transforms: ['random_flip']
  save_dir: 'log/resnet50_fc512_wildtiger_softmax_amsgrad'

loss:
  name: 'softmax'
  softmax:
    label_smooth: True

train:
  optim: 'amsgrad'
  lr: 0.0003
  max_epoch: 30
  batch_size: 32
  fixbase_epoch: 12
  open_layers: ['fc', 'classifier']
  lr_scheduler: 'cosine'
  #lr_scheduler: 'single_step'
  #stepsize: [20]

test:
  batch_size: 100
  dist_metric: 'euclidean'
  normalize_feature: False
  evaluate: False
  eval_freq: -1
  rerank: False
  # The engine permits visrank only in evaluation-only mode. Enable both
  # evaluate and visrank after setting model.load_weights to a checkpoint.
  visrank: False
  visrank_topk: 10
